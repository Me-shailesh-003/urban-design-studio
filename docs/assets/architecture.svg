<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:Arial,sans-serif;fill:#0b1a2e}.box{fill:#eef2f7;stroke:#0b1a2e;stroke-width:2}.cloud{fill:#e2f0e5;stroke:#2d6a4f;stroke-width:2}.line{stroke:#0b1a2e;stroke-width:2;marker-end:url(#a)}.t{font-size:22px;font-weight:bold}.s{font-size:16px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b1a2e"/></marker></defs><rect x="50" y="60" width="1100" height="130" rx="8" class="box"/><text x="600" y="105" text-anchor="middle" class="t">Presentation Layer — Browser</text><text x="600" y="145" text-anchor="middle" class="s">index.html, admin.html, styles.css, script.js, admin.js, Canvas API</text><rect x="50" y="285" width="1100" height="130" rx="8" class="box"/><text x="600" y="330" text-anchor="middle" class="t">Application Layer — Node.js / Express</text><text x="600" y="370" text-anchor="middle" class="s">server.js, REST router, CORS, dotenv, body parser, Multer, validation</text><rect x="50" y="510" width="520" height="130" rx="8" class="cloud"/><text x="310" y="555" text-anchor="middle" class="t">Firebase RTDB</text><text x="310" y="595" text-anchor="middle" class="s">projects, team, messages</text><rect x="630" y="510" width="520" height="130" rx="8" class="cloud"/><text x="890" y="555" text-anchor="middle" class="t">ImgBB Cloud API</text><text x="890" y="595" text-anchor="middle" class="s">uploaded image URL</text><line x1="600" y1="190" x2="600" y2="285" class="line"/><line x1="420" y1="415" x2="310" y2="510" class="line"/><line x1="780" y1="415" x2="890" y2="510" class="line"/></svg>
